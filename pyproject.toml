[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modmux"
version = "0.4.0"
description = "Single interface for several game mod portals"
readme = "README.md"
requires-python = ">= 3.13"
authors = [{ name = "APasz" }]
license = { text = "MIT" }
license-files = ["LICENSE"]

dependencies = [
    "pydantic>=2,<3",
    "httpx>=0.28,<1",
    "aiolimiter>=1.2,<2"
]

[dependency-groups]
dev = [
    "basedpyright",
    "coverage",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
modmux = "modmux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modmux"]

[tool.hatch.build.targets.sdist]
include = ["src/modmux", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=modmux --cov-report=term-missing"

[tool.coverage.run]
source = ["src/modmux"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
typeCheckingMode = "standard"
include = ["."]
venvPath = "."
venv = ".venv"
