name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read version from pyproject.toml
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          text = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version = "(?P<version>[^"]+)"$', text)
          if not match:
              raise SystemExit("Failed to read version from pyproject.toml")
          print(f"version={match.group('version')}")
          PY
      - name: Verify changelog version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -Eq "^## \\[?${VERSION}\\]?$" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a '## ${VERSION}' heading."
            exit 1
          fi
      - name: Ensure tag does not exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin."
            exit 1
          fi
      - name: Install package and run tests
        run: python -m pip install --upgrade pip && python -m pip install . && python -m unittest discover -s tests
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git tag "${TAG}"
          git push origin "${TAG}"
